function box(){fade=1;g.fillStyle="rgba(0,0,0,.80)";g.fillRect(12,170,296,55);g.strokeStyle="#fff";g.strokeRect(12,170,296,55);g.fillStyle="#fff";g.font="10px monospace";let s=msg[mi]||"",w=s.split(" "),line="",y=190;for(let a of w){if((line+a).length>35){g.fillText(line,24,y);line=a+" ";y+=13}else line+=a+" "}g.fillText(line,24,y);g.fillText("tap ACT",258,218)}
